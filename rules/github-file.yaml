name: "github-file-redirect"
description: "Redirect GitHub blob pages to raw.githubusercontent.com for clean content"
priority: 100

match:
  type: domain
  domains:
    - github.com
  paths:
    - "/{owner}/{repo}/blob/{branch}/{*filepath}"

sources:
  - name: "raw"
    type: "redirect"
    url: "https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{filepath}"
    validate:
      status: [200]
      minLength: 50
    on_error:
      action: "continue"  # raw限流时回退到github-html

  - name: "github-html"
    type: "original"
    on_error:
      action: "abort"
      message: "无法获取GitHub内容。可能原因：1) 仓库不存在或私有 2) 网络受限 3) GitHub服务不可用"
      status: "error"

process:
  - when: "source == 'github-html'"
    actions:
      - action: remove_until
        pattern: "^# "
        keepMatch: true
      - action: remove_lines_matching
        patterns:
          - "^\\[Sign in\\].*$"
          - "^\\[Copy link\\].*$"
          - "^\\[Copy path\\].*$"
          - "^Issue body actions$"
          - "^No (one|labels|type|fields|milestone).*$"
          - "^Toggle navigation$"
          - "^Appearance settings$"
          - "^\\d+ lines? \\("